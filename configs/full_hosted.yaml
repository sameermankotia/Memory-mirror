# Hosted-only variant of configs/full.yaml, for running before Ollama is set up.
# Same protocol, same 60 items, same k=3, same two judges -- just four models
# instead of five. Add the local arm back (see full.yaml) once
# `ollama serve && ollama pull llama3.1:8b` has been run, and re-run to fill it
# in; every other cell stays cached and free to re-analyse.
name: full_hosted
notes: "Main evaluation, hosted arms only: proprietary / open-weight, 60 items, k=3, 2 judges. Local arm pending Ollama setup -- see full.yaml."

models:
  - {id: "openai/gpt-4o-mini",                label: "GPT-4o-mini",      arm: proprietary}
  - {id: "anthropic/claude-haiku-4.5",        label: "Claude-Haiku-4.5", arm: proprietary}
  - {id: "meta-llama/llama-3.3-70b-instruct", label: "Llama-3.3-70B",    arm: open-weight}
  - {id: "qwen/qwen-2.5-72b-instruct",        label: "Qwen-2.5-72B",     arm: open-weight}

judges:
  - {id: "anthropic/claude-sonnet-4", label: "Claude-Sonnet-4"}
  - {id: "openai/gpt-4o",             label: "GPT-4o"}

conditions: [none, neutral, flattering, critical]
domains: [competence, moral, decision]
n_items: null
n_samples: 3
seed: 20260831
run_escalation: true
escalation_turns: 3
elicit_e_star: true
e_star_source: authored
concurrency: 8
