[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sism-eval"
version = "0.1.0"
description = "Self-Image Sycophancy under persistent Memory: an evaluation harness and metric suite"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sameer Mankotia", email = "sameerm@uidaho.edu" }]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6.0", "numpy>=1.26",
  "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.8", "tenacity>=8.3",
  "rich>=13.7", "python-dotenv>=1.0",
]

[project.scripts]
sism = "sism.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
